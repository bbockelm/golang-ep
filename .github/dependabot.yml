# Managed by Dependabot: keep GitHub Actions current (including SHA-pinned actions,
# whose pins are bumped when the action cuts a new release). Grouped into a single
# weekly PR to keep the noise down.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"

  # Go modules. This repo is a single module rooted at "/". Minor and patch
  # bumps are grouped into one weekly PR to cut noise; majors come as
  # individual PRs so they get reviewed on their own.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      go-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
